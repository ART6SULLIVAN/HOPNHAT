<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Bài Viết - HOPNHAT CONSULTING FIRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <span class="text-xl font-bold text-blue-600">HOPNHAT CONSULTING FIRM</span>
            <a href="index.html" class="text-sm text-blue-600 hover:underline">&larr; Quay lại Trang Chủ</a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-12 bg-white my-8 rounded-xl border border-slate-200 shadow-sm">
        <div id="post-content" class="space-y-6">
            <span id="post-category" class="text-xs bg-blue-100 text-blue-700 px-3 py-1 rounded font-medium">Chuyên Mục</span>
            <h1 id="post-title" class="text-3xl font-extrabold text-slate-900">Đang tải nội dung bài viết...</h1>
            <div class="text-xs text-slate-400 border-b pb-4">Đăng bởi Quản trị viên • Cập nhật tự động</div>
            <div id="post-body" class="prose max-w-none text-slate-700 space-y-4 leading-relaxed">
                <p>Hệ thống đang trích xuất nội dung chi tiết từ cơ sở dữ liệu bài viết...</p>
            </div>
        </div>
    </main>

    <script>
        // Cơ sở dữ liệu mẫu cho các bài viết chi tiết
        const postsData = {
            "1": {
                category: "AI & Tự Động Hóa",
                title: "Ứng dụng Mô hình ngôn ngữ vào việc kiểm soát hóa đơn tự động",
                body: "Trong kỷ nguyên số, việc kiểm soát hàng ngàn hóa đơn đầu vào thủ công tiêu tốn rất nhiều thời gian của doanh nghiệp siêu nhỏ. Bằng cách ứng dụng các mô hình ngôn ngữ lớn (LLM), hệ thống có thể tự động bóc tách thông tin mã số thuế, tiền thuế, tên hàng hóa từ hóa đơn PDF hoặc hình ảnh với độ chính xác lên tới 98%..."
            },
            "2": {
                category: "Tin Tức AI",
                title: "AI Giúp Tự Động Hóa Báo Cáo Tài Chính Như Thế Nào?",
                body: "Báo cáo tài chính cuối năm hay định kỳ hàng quý luôn là áp lực lớn đối với các nhà quản lý và kế toán viên. Sự hỗ trợ từ AI giúp kết nối trực tiếp dữ liệu thu chi, tự động phân bổ chi phí trả trước, trích khấu hao tài sản cố định và lập bảng cân đối phát sinh chỉ trong vài cú nhấp chuột..."
            },
            "3": {
                category: "Tự Động Hóa Kế Toán",
                title: "Cách AI Tối Ưu Quản Lý Dòng Tiền Cho Doanh Nghiệp Nhỏ",
                body: "Dòng tiền là mạch máu của doanh nghiệp siêu nhỏ. Việc dự báo thiếu hụt dòng tiền thường dẫn đến rủi ro thanh khoản. Các giải pháp tích hợp AI hiện nay có khả năng phân tích chu kỳ thu - chi trong quá khứ để đưa ra cảnh báo sớm về các khoản phải thu quá hạn..."
            },
            "4": {
                category: "Quản Trị Tinh Gọn",
                title: "AI trong Kế Toán: Tương Lai Của Doanh Nghiệp Siêu Nhỏ",
                body: "Chuyển đổi số không còn là câu chuyện riêng của các tập đoàn lớn. Doanh nghiệp siêu nhỏ hoàn toàn có thể tận dụng các công cụ đám mây kết hợp AI để xây dựng bộ máy kế toán tinh gọn, giảm thiểu nhân sự thủ công nhưng vẫn đảm bảo tuyệt đối tính tuân thủ pháp luật thuế..."
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id') || '1';
        const post = postsData[postId];

        if (post) {
            document.getElementById('post-category').innerText = post.category;
            document.getElementById('post-title').innerText = post.title;
            document.getElementById('post-body').innerHTML = `<p>${post.body}</p><p>Nội dung chi tiết tiếp tục được cập nhật tự động từ hệ thống quét tin tức thông minh của HOPNHAT CONSULTING FIRM phục vụ công tác nghiên cứu và vận hành nội bộ.</p>`;
        }
    </script>
</body>
</html>
