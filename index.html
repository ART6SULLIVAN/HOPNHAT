//  STORAGE & DATA MIGRATION (Nâng cấp DB lên v2 để ép reset tài khoản)
// ═══════════════════════════════════════════
const K={u:'hub_users_v2', p:'hub_posts', s:'hub_sess_v2', cfg:'hub_cfg', ext_apps:'hub_ext_apps'};
const ls=k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}};
const sv=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const rm=k=>localStorage.removeItem(k);

function getAPPS(){
  let apps = ls(K.ext_apps);
  if(!apps) {
    const oldUrls = ls('hub_apps') || {};
    const oldNames = ls('hub_appnames') || {};
    apps = DEFAULT_APPS.map(a => ({
      ...a, 
      name: oldNames[a.id] || a.name, 
      url: oldUrls[a.id] || a.url
    }));
    sv(K.ext_apps, apps);
  }
  return apps;
}

const portalName=()=>(ls(K.cfg)||{}).name||'HOPNHAT HUB';
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const $=id=>document.getElementById(id);
const canPost=u=>u&&u.username===OWNER;
const ic=(name,cls='w-5 h-5')=>`<i data-lucide="${name}" class="${cls}" style="display:inline-block;vertical-align:middle"></i>`;
function fmtDate(s){if(!s)return'';const d=new Date(s);if(isNaN(d))return s;return d.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})}
function luCreate(){if(window.lucide)lucide.createIcons();else setTimeout(()=>{if(window.lucide)lucide.createIcons()},150)}

async function hashPw(pw){
  try {
    if(window.crypto && crypto.subtle) {
      const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('hnshub::'+pw));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  } catch(e) {}
  return btoa(unescape(encodeURIComponent('hnshub::'+pw))); 
}

const S={page:'home',user:null,modal:null,loginErr:null,toast:null};
function go(page){S.page=page;S.modal=null;S.loginErr=null;render();window.scrollTo(0,0)}
function showToast(msg,type='ok'){S.toast={msg,type};render();setTimeout(()=>{S.toast=null;render()},3200)}

async function doLogin(uname,pw){
  const users=ls(K.u)||[];
  const u=users.find(x=>x.username.toLowerCase()===uname.toLowerCase().trim());
  if(!u){S.loginErr='Tên đăng nhập không tồn tại.';render();return}
  const h=await hashPw(pw);
  if(h!==u.pwHash){S.loginErr='Mật khẩu không đúng.';render();return}
  sv(K.s,u.id);S.user=u;go('dashboard');
}
function doLogout(){rm(K.s);S.user=null;go('home')}

function renderModal(){
  const m=S.modal;if(!m)return'';

          <button class="w-8 h-8 rounded-lg flex items-center justify-center hover:bg-white/10 text-slate-400 hover:text-white transition" data-act="closeModal">${ic('x','w-4 h-4')}</button>
        </div>

    return wrap(isEdit?'Sửa người dùng':'Thêm người dùng',

      inp('m-pw',isEdit?'Mật khẩu mới (để trống = không đổi)':'Mật khẩu *','password','',isEdit?'Để trống nếu không muốn đổi':'Nhập mật khẩu')+
      `<div class="mb-4"><label class="block text-xs font-bold text-white/70 uppercase tracking-wide mb-1.5">Vai trò</label>
        <select class="w-full px-4 py-2.5 border border-white/20 rounded-xl text-sm bg-slate-900/80 text-white focus:outline-none focus:border-blue-400 font-bold transition" id="m-role">
          <option value="member" ${(u.role||'member')==='member'?'selected':''}>Thành viên</option>

      <div id="m-err" class="hidden bg-red-500/20 border border-red-500/30 text-red-200 px-4 py-3 rounded-xl text-sm font-bold"></div>`,

      inp('m-app-url','Đường dẫn URL','url','','https://...') +
      `<div class="grid grid-cols-2 gap-4">` +

      inp('m-app-color','Mã màu (Hex)','text','#3b82f6','#3b82f6') +

      btns('Thêm mới','saveNewApp')

  }
  if(m.type==='confirm'){
    return wrap('Xác nhận thao tác',`<p class="text-sm font-medium text-white">${esc(m.msg)}</p>`,
      `<button class="px-5 py-2.5 rounded-xl bg-white/10 border border-white/10 font-bold text-white text-sm hover:bg-white/20 transition" data-act="closeModal">Hủy</button>

  return'';
}

const PAGE_TITLES={dashboard:'Dashboard',apps:'Danh mục Ứng dụng',board:'Bảng tin nội bộ','admin-users':'Quản lý người dùng','admin-posts':'Quản lý thông báo','admin-apps':'Cài đặt hệ thống'};

function render(){
  const app=document.getElementById('app'),noSide=!S.user||['home','login'].includes(S.page);
  let pg='';
  if(S.page==='home')pg=pgHome();
  else if(S.page==='login')pg=pgLogin();
  else if(!S.user){go('login');return}
  else if(S.page==='dashboard')pg=pgDashboard();
  else if(S.page==='apps')pg=pgApps();
  else if(S.page==='board')pg=pgBoard();
  else if(S.page==='admin-users'&&S.user.role==='admin')pg=pgAdminUsers();
  else if(S.page==='admin-posts'&&S.user.role==='admin')pg=pgAdminPosts();
  else if(S.page==='admin-apps'&&S.user.role==='admin')pg=pgAdminApps();
  else{go('dashboard');return}
  const toast=S.toast?`<div class="fixed bottom-6 right-6 z-50 px-5 py-3 rounded-xl font-bold text-sm shadow-xl anim-fadeup border backdrop-blur-md ${S.toast.type==='ok'?'bg-emerald-500/20 text-emerald-200 border-emerald-500/30':'bg-red-500/20 text-red-200 border-red-500/30'}">${esc(S.toast.msg)}</div>`:'';
  
  if(noSide){
    app.innerHTML=pg+renderModal()+toast;
  } else {
    app.innerHTML=`<div class="flex" style="min-height:100vh">
      ${renderSidebar()}
      <div class="flex-1 min-w-0 flex flex-col" style="min-height:100vh">
        <header class="bg-white/5 backdrop-blur-md border-b border-white/10 px-8 py-4 flex items-center gap-4 sticky top-0 z-10">
          <h1 class="text-lg font-extrabold text-white flex-1">${PAGE_TITLES[S.page]||''}</h1>
          ${S.user?.role==='admin'?`<span class="inline-flex items-center gap-1.5 bg-slate-900/80 border border-white/20 text-white px-3.5 py-1.5 rounded-full text-xs font-bold shadow-sm">${ic('shield','w-3 h-3')} Admin</span>`:''}
        </header>
        <main class="flex-1 bg-transparent">${pg}</main>
      </div>
    </div>${renderModal()}${toast}`;
  }
  attachEvents();
  luCreate();
}

// ═══════════════════════════════════════════
//  EVENTS
// ═══════════════════════════════════════════
function attachEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();go(el.dataset.nav)}));
  const btnLg=$('btn-lg');
  if(btnLg){
    const doLg=()=>doLogin($('lg-u').value,$('lg-p').value);
    btnLg.addEventListener('click',doLg);
    $('lg-p')?.addEventListener('keydown',e=>{if(e.key==='Enter')doLg()});
    $('lg-u')?.addEventListener('keydown',e=>{if(e.key==='Enter')$('lg-p').focus()});
  }
  document.querySelectorAll('[data-nourl]').forEach(el=>el.addEventListener('click',e=>{
    e.preventDefault();
    if(S.user?.role==='admin'){go('admin-apps');showToast('Vui lòng cài đặt URL cho ứng dụng này.','err')}
    else showToast('Ứng dụng này chưa sẵn sàng. Liên hệ quản trị viên.','err');
  }));
  document.querySelectorAll('[data-act]').forEach(el=>el.addEventListener('click',async e=>{
    e.preventDefault();const act=el.dataset.act;
    if(act==='logout'){doLogout();return}
    if(act==='closeModal'){S.modal=null;render();return}
    
    // PORTAL NAME
    if(act==='savePortalName'){
      const n = $('cfg-pname')?.value.trim();
      if(n){ sv(K.cfg, {...(ls(K.cfg)||{}), name: n}); showToast('Đã cập nhật tên hệ thống.'); render(); }
      return;
    }

    // NEW APP SETTINGS (PER APP)
    if(act==='addApp'){ S.modal={type:'app'}; render(); return; }
    if(act==='saveNewApp'){
      const name = $('m-app-name')?.value.trim();
      const desc = $('m-app-desc')?.value.trim();
      const url = $('m-app-url')?.value.trim();
      const icon = $('m-app-icon')?.value.trim() || 'box';
      const color = $('m-app-color')?.value.trim() || '#3b82f6';
      const errEl = $('m-err'), setErr=msg=>{if(errEl){errEl.textContent=msg;errEl.classList.remove('hidden')}};
      if(!name){setErr('Vui lòng nhập tên ứng dụng.'); return;}
      const apps = getAPPS();
      apps.push({id: 'app_'+Date.now(), name, desc, url, icon, color});
      sv(K.ext_apps, apps);
      S.modal=null; render(); showToast('Đã thêm ứng dụng mới vào hệ thống.'); return;
    }
    if(act==='saveApp'){
      const aid = el.dataset.aid;
      const apps = getAPPS();
      const idx = apps.findIndex(a=>a.id===aid);
      if(idx>=0){
        apps[idx].name = $(`an-${aid}`)?.value.trim() || apps[idx].name;
        apps[idx].url = $(`au-${aid}`)?.value.trim() || '';
        apps[idx].desc = $(`ad-${aid}`)?.value.trim() || '';
        sv(K.ext_apps, apps);
        showToast('Đã lưu cấu hình ứng dụng.'); render();
      }
      return;
    }
    if(act==='delApp'){
      const aid = el.dataset.aid;
      S.modal={type:'confirm', msg:'Bạn có chắc muốn xóa ứng dụng này khỏi hệ thống? (Các tài khoản đang được cấp quyền cũng sẽ bị gỡ bỏ ứng dụng này).', onOk:()=>{
        const apps = getAPPS().filter(a=>a.id!==aid);
        sv(K.ext_apps, apps);
        S.modal = null; render(); showToast('Đã xóa ứng dụng.');
      }};
      render(); return;
    }

    // USERS
    if(act==='addUser'){S.modal={type:'user',user:{apps:[]}};render();return}
    if(act==='editUser'){const u=(ls(K.u)||[]).find(x=>x.id==el.dataset.uid);if(u){S.modal={type:'user',user:{...u}};render()}return}
    if(act==='delUser'){
      const uid=parseInt(el.dataset.uid);
      S.modal={type:'confirm',msg:'Bạn có chắc muốn xóa người dùng này?',onOk:()=>{sv(K.u,(ls(K.u)||[]).filter(u=>u.id!==uid));S.modal=null;render();showToast('Đã xóa người dùng.')}};
      render();return;
    }
    if(act==='saveUser'){
      const name=$('m-name')?.value.trim(),uname=$('m-uname')?.value.trim().toLowerCase(),pw=$('m-pw')?.value,role=$('m-role')?.value||'member';
      const apps=[...document.querySelectorAll('input[name="ap"]:checked')].map(x=>x.value);
      const uid=el.dataset.uid?parseInt(el.dataset.uid):null;
      const errEl=$('m-err'),setErr=msg=>{if(errEl){errEl.textContent=msg;errEl.classList.remove('hidden')}};
      if(!name||!uname){setErr('Vui lòng điền đầy đủ họ tên và tên đăng nhập.');return}
      if(!uid&&!pw){setErr('Vui lòng nhập mật khẩu.');return}
      const users=ls(K.u)||[];
      if(users.find(u=>u.username===uname&&u.id!==uid)){setErr('Tên đăng nhập đã tồn tại.');return}
      if(uid){const idx=users.findIndex(u=>u.id===uid);if(idx>=0){users[idx]={...users[idx],name,username:uname,role,apps};if(pw)users[idx].pwHash=await hashPw(pw);if(uid===S.user.id)S.user=users[idx]}}
      else users.push({id:Date.now(),name,username:uname,role,apps,pwHash:await hashPw(pw)});
      sv(K.u,users);S.modal=null;go('admin-users');showToast(uid?'Đã cập nhật người dùng.':'Đã thêm người dùng.');return;
    }
    // POSTS
    if(act==='addPost'){if(!canPost(S.user)){showToast('Bạn không có quyền đăng tin.','err');return}S.modal={type:'post',post:{}};render();return}
    if(act==='editPost'){if(!canPost(S.user)){showToast('Bạn không có quyền sửa tin.','err');return}const p=(ls(K.p)||[]).find(x=>x.id==el.dataset.pid);if(p){S.modal={type:'post',post:{...p}};render()}return}
    if(act==='delPost'){
      if(!canPost(S.user)){showToast('Bạn không có quyền xóa tin.','err');return}
      const pid=parseInt(el.dataset.pid);
      S.modal={type:'confirm',msg:'Bạn có chắc muốn xóa thông báo này?',onOk:()=>{sv(K.p,(ls(K.p)||[]).filter(p=>p.id!==pid));S.modal=null;render();showToast('Đã xóa thông báo.')}};
      render();return;
    }
    if(act==='savePost'){
      if(!canPost(S.user)){showToast('Bạn không có quyền đăng tin.','err');return}
      const title=$('m-title')?.value.trim(),content=$('m-content')?.value.trim(),pid=el.dataset.pid||null;
      const errEl=$('m-err');
      if(!title||!content){if(errEl){errEl.textContent='Vui lòng điền đầy đủ tiêu đề và nội dung.';errEl.classList.remove('hidden')}return}
      const posts=ls(K.p)||[];
      if(pid){const idx=posts.findIndex(p=>p.id==pid);if(idx>=0)posts[idx]={...posts[idx],title,content,updatedAt:new Date().toISOString()}}
      else posts.push({id:Date.now(),title,content,date:new Date().toISOString()});
      sv(K.p,posts);S.modal=null;render();showToast(pid?'Đã cập nhật thông báo.':'Đã đăng thông báo.');return;
    }
    if(act==='confirmAct'){S.modal?.onOk?.();return}
  }));
  document.getElementById('mbg')?.addEventListener('click',e=>{if(e.target.id==='mbg'){S.modal=null;render()}});
}

// ═══════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════
async function init(){
  try {
    if(!ls(K.u) || ls(K.u).length === 0){
      const initializedUsers = [];
      for (let user of INIT_USERS) {
        const h = await hashPw(user.initPw);
        initializedUsers.push({...user, pwHash: h});
      }
      sv(K.u, initializedUsers);
    }
  } catch(e) {
    console.error("Lỗi khởi tạo:", e);
  }
  
  if(!ls(K.p))sv(K.p,[]);
  const sid=ls(K.s);
  if(sid){const u=(ls(K.u)||[]).find(x=>x.id===sid);if(u){S.user=u;S.page='dashboard'}}
  render();
}
init();
</script>
